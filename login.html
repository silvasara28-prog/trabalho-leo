<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="login.css" rel="stylesheet">
</head>
<body>
    <div class="copo">
        <center>
            <h1 class="corTitulo"> FAÇA SEU LOGIN </h1>
            
            <form action="paginainicial.html" method="GET">

                <label for="gmail">Gmail:</label><br><br>
                <input type="email" id="gmail" name="gmail" placeholder="gmail" required><br><br>

                <label for="nome">Nome completo:</label><br><br>
                <input type="text" id="nome" name="nome" placeholder="digite seu nome" required><br><br>

                <label for="cpf">Cpf (somente números):</label><br><br>
                <input type="text" id="cpf" name="cpf" placeholder="00000000000" 
                       pattern="\d{11}" title="Digite apenas os 11 números do CPF" required><br><br>

                <button type="submit" class="abelinha">entrar</button>
            </form>

            <p id="demo" style="margin-top: 20px; color: #333; font-weight: bold;"></p>
        </center>
    </div>

    <script>
        function multiply(a, b) {
            return a * b;
        }

        let result = multiply(4, 3);

        document.getElementById("demo").innerHTML = "The result is " + result;
    </script>
</body>
</html>
